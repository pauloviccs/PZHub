<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VICCS TV // Transmissão Ao Vivo</title>
    <style>
      :root {
        --bg-color: #06090e;
        --glass-surface: rgba(14, 20, 30, 0.88);
        --border-tactical: rgba(255, 255, 255, 0.12);
        --accent-green: #2ecc71;
        --accent-amber: #f1c40f;
        --accent-cyan: #00d2d3;
        --accent-red: #ff4757;
        --text-primary: #e2e8f0;
        --text-muted: #8896a6;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }

      body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: var(--bg-color);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
        color: var(--text-primary);
        display: flex;
        flex-direction: column;
        border: 1px solid var(--border-tactical);
        border-radius: 8px;
        box-shadow: 0 12px 36px rgba(0, 0, 0, 0.75), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
      }

      /* Barra de Título Arrastável (Drag Region) */
      .pip-header {
        height: 28px;
        background: var(--glass-surface);
        backdrop-filter: blur(12px);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 10px;
        border-bottom: 1px solid var(--border-tactical);
        cursor: grab;
        z-index: 100;
        -webkit-app-region: drag;
      }

      .pip-header:active {
        cursor: grabbing;
      }

      .pip-title-cluster {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: grab;
      }

      .pip-status-led {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--accent-amber);
        box-shadow: 0 0 8px var(--accent-amber);
        transition: background 0.3s, box-shadow 0.3s;
      }

      .pip-status-led.live {
        background: var(--accent-green);
        box-shadow: 0 0 10px var(--accent-green);
      }

      .pip-title-text {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1px;
        color: var(--accent-cyan);
        text-transform: uppercase;
        font-family: "JetBrains Mono", Consolas, monospace;
      }

      .pip-controls {
        display: flex;
        align-items: center;
        gap: 4px;
        -webkit-app-region: no-drag;
      }

      .pip-btn {
        background: transparent;
        border: none;
        color: var(--text-muted);
        width: 20px;
        height: 20px;
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: color 0.15s, background 0.15s;
        -webkit-app-region: no-drag;
      }

      .pip-btn.pin {
        color: var(--text-muted);
      }

      .pip-btn.pin.active {
        color: var(--accent-cyan);
        background: rgba(0, 210, 211, 0.15);
        box-shadow: 0 0 8px rgba(0, 210, 211, 0.4);
      }

      .pip-btn.drag {
        cursor: grab;
        color: var(--accent-cyan);
      }

      .pip-btn.drag:hover {
        background: rgba(0, 210, 211, 0.2);
        color: #fff;
      }

      .pip-btn.drag:active {
        cursor: grabbing;
      }

      .pip-btn:hover {
        background: rgba(255, 255, 255, 0.1);
        color: var(--text-primary);
      }

      .pip-btn.close:hover {
        background: var(--accent-red);
        color: #fff;
      }

      .pip-btn svg {
        width: 12px;
        height: 12px;
        fill: currentColor;
      }

      /* Container de Vídeo */
      .pip-screen-container {
        flex: 1;
        position: relative;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      #yt-video-frame {
        width: 100%;
        height: 100%;
        border: none;
        pointer-events: auto;
      }

      /* Tela de Standby / Sem Sinal */
      .pip-standby {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at center, #101924 0%, #06090e 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        z-index: 10;
        transition: opacity 0.3s ease;
      }

      .pip-standby.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .standby-icon {
        width: 38px;
        height: 38px;
        fill: var(--accent-cyan);
        opacity: 0.8;
      }

      .standby-text {
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        letter-spacing: 1.5px;
        color: var(--text-muted);
        text-transform: uppercase;
      }

      /* Efeito CRT Scanlines sutil */
      .crt-scanlines {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          rgba(18, 16, 16, 0) 50%, 
          rgba(0, 0, 0, 0.25) 50%
        ), linear-gradient(
          90deg,
          rgba(255, 0, 0, 0.03),
          rgba(0, 255, 0, 0.01),
          rgba(0, 0, 255, 0.03)
        );
        background-size: 100% 3px, 6px 100%;
        pointer-events: none;
        z-index: 20;
        opacity: 0.6;
      }

      /* OSD (On-Screen Display) de Canal / Volume */
      .pip-osd {
        position: absolute;
        top: 10px;
        left: 12px;
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        font-weight: 700;
        color: var(--accent-green);
        text-shadow: 0 0 6px var(--accent-green);
        z-index: 30;
        opacity: 0;
        transition: opacity 0.5s ease;
        pointer-events: none;
      }

      .pip-osd.show {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <!-- Barra Arrastável -->
    <div class="pip-header" data-tauri-drag-region>
      <div class="pip-title-cluster" data-tauri-drag-region>
        <div id="pip-led" class="pip-status-led"></div>
        <span class="pip-title-text" data-tauri-drag-region>VICCS CRT-TV // LIVE</span>
      </div>
      <div class="pip-controls">
        <button id="btn-pip-pin" class="pip-btn pin active" title="Fixar por cima do jogo (Always On Top)">
          <svg viewBox="0 0 24 24"><path d="M16 12V4h1V2H7v2h1v8l-2 2v2h5.2v6h1.6v-6H18v-2l-2-2z"/></svg>
        </button>
        <button id="btn-pip-drag" class="pip-btn drag" title="Arrastar Janela da TV (Clique e segure para mover)" data-tauri-drag-region>
          <svg viewBox="0 0 24 24"><path d="M10 9h4V6h3l-5-5-5 5h3v3zm-1 1H6V7l-5 5 5 5v-3h3v-4zm14 2l-5-5v3h-3v4h3v3l5-5zm-9 3h-4v3H7l5 5 5-5h-3v-3z"/></svg>
        </button>
        <button id="btn-pip-close" class="pip-btn close" title="Ocultar Tela Flutuante">
          <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </div>
    </div>

    <!-- Tela do Tubo CRT -->
    <div class="pip-screen-container">
      <div class="crt-scanlines"></div>
      <div id="pip-osd" class="pip-osd">CANAL 03 - SINAL AV</div>
      
      <!-- Standby Overlay -->
      <div id="pip-standby" class="pip-standby">
        <svg class="standby-icon" viewBox="0 0 24 24">
          <path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 1.99-.9 1.99-2L23 5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/>
        </svg>
        <span class="standby-text">AGUARDANDO SINAL DA TV...</span>
      </div>

      <!-- Iframe para reprodução de vídeo -->
      <iframe
        id="yt-video-frame"
        src="about:blank"
        allow="autoplay; encrypted-media; picture-in-picture"
        allowfullscreen>
      </iframe>
    </div>

    <script type="module">
      const isTauri = typeof window.__TAURI__ !== 'undefined';
      const standbyOverlay = document.getElementById('pip-standby');
      const led = document.getElementById('pip-led');
      const osd = document.getElementById('pip-osd');
      const videoFrame = document.getElementById('yt-video-frame');
      const btnClose = document.getElementById('btn-pip-close');
      const btnPin = document.getElementById('btn-pip-pin');

      let currentMediaKey = null;
      let osdTimeout = null;

      function showOSD(text) {
        if (!osd) return;
        osd.textContent = text;
        osd.classList.add('show');
        clearTimeout(osdTimeout);
        osdTimeout = setTimeout(() => osd.classList.remove('show'), 3000);
      }

      function parseYouTubeMedia(url) {
        if (!url) return { videoId: null, playlistId: null };
        let playlistId = null;
        const listMatch = url.match(/[?&]list=([^#&?]+)/);
        if (listMatch && listMatch[1]) playlistId = listMatch[1];
        let videoId = null;
        const vMatch = url.match(/(?:v=|\/embed\/|youtu\.be\/|v\/|watch\?v=|&v=)([^#&?]+)/);
        if (vMatch && vMatch[1] && vMatch[1].length === 11) videoId = vMatch[1];
        return { videoId, playlistId };
      }

      // Controle do Modo "Always On Top" (Fixar sobre o jogo)
      let isAlwaysOnTop = localStorage.getItem('viccs_pip_always_on_top') !== 'false'; // default true
      if (btnPin) {
        btnPin.classList.toggle('active', isAlwaysOnTop);
        btnPin.addEventListener('click', async (e) => {
          e.stopPropagation();
          isAlwaysOnTop = !isAlwaysOnTop;
          localStorage.setItem('viccs_pip_always_on_top', isAlwaysOnTop);
          btnPin.classList.toggle('active', isAlwaysOnTop);
          if (isTauri && window.__TAURI__?.core?.invoke) {
            try {
              await window.__TAURI__.core.invoke('set_pip_always_on_top', { alwaysOnTop: isAlwaysOnTop });
            } catch (err) {
              console.warn('Erro ao alternar always on top:', err);
            }
          }
          showOSD(isAlwaysOnTop ? 'FIXADO SOBRE O JOGO' : 'FIXAÇÃO DESATIVADA');
        });
      }

      // Garante que o estado de Always On Top seja aplicado na inicialização
      if (isTauri && window.__TAURI__?.core?.invoke) {
        window.__TAURI__.core.invoke('set_pip_always_on_top', { alwaysOnTop: isAlwaysOnTop }).catch(() => {});
      }

      // Comunicação via BroadcastChannel com o Motor Principal do PZHub
      const broadcast = new BroadcastChannel('viccs_broadcasting_bus');

      broadcast.onmessage = (event) => {
        const msg = event.data;
        if (!msg) return;

        if (msg.type === 'SYNC_TV_STREAM') {
          const media = parseYouTubeMedia(msg.url);
          const videoId = msg.videoId || media.videoId;
          const playlistId = msg.playlistId || media.playlistId;

          if (videoId || playlistId) {
            const targetKey = playlistId ? `playlist_${playlistId}_${videoId || ''}` : `video_${videoId}`;
            if (currentMediaKey !== targetKey) {
              currentMediaKey = targetKey;
              const startTime = Math.max(0, Math.floor(msg.offsetSeconds || 0));

              let embedSrc = '';
              if (videoId && playlistId) {
                embedSrc = `https://www.youtube.com/embed/${videoId}?autoplay=1&controls=0&mute=${msg.isMuted ? 1 : 0}&start=${startTime}&list=${playlistId}&enablejsapi=1&rel=0&modestbranding=1`;
              } else if (playlistId) {
                embedSrc = `https://www.youtube.com/embed/videoseries?list=${playlistId}&autoplay=1&controls=0&mute=${msg.isMuted ? 1 : 0}&enablejsapi=1&rel=0&modestbranding=1`;
              } else {
                embedSrc = `https://www.youtube.com/embed/${videoId}?autoplay=1&controls=0&mute=${msg.isMuted ? 1 : 0}&start=${startTime}&enablejsapi=1&rel=0&modestbranding=1`;
              }

              videoFrame.src = embedSrc;
              standbyOverlay.classList.add('hidden');
              led.classList.add('live');
              showOSD(playlistId ? 'CANAL 03 // PLAYLIST SINCRONIZADA' : 'CANAL 03 // TRANSMISSÃO SINCRONIZADA');
            } else {
              // Garante que o player despause caso estivesse pausado
              if (videoFrame && videoFrame.contentWindow) {
                videoFrame.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
              }
            }
          }
        } else if (msg.type === 'PAUSE_TV_STREAM') {
          if (videoFrame && videoFrame.contentWindow) {
            videoFrame.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*');
          }
          showOSD('CANAL 03 // PAUSADO');
        } else if (msg.type === 'RESUME_TV_STREAM') {
          if (videoFrame && videoFrame.contentWindow) {
            videoFrame.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
          }
          showOSD('CANAL 03 // TRANSMISSÃO RETOMADA');
        } else if (msg.type === 'STOP_TV_STREAM') {
          currentMediaKey = null;
          videoFrame.src = 'about:blank';
          standbyOverlay.classList.remove('hidden');
          led.classList.remove('live');
          showOSD('SEM SINAL // STANDBY');
        }
      };

      // Botão Fechar / Ocultar
      btnClose.addEventListener('click', async () => {
        if (isTauri && window.__TAURI__?.core?.invoke) {
          try {
            await window.__TAURI__.core.invoke('set_pip_window_visible', { visible: false });
          } catch (e) {
            console.error('Erro ao ocultar janela PiP:', e);
          }
        } else {
          window.close();
        }
      });

      // Controle de arrasto nativo da janela flutuante
      const triggerDrag = async (e) => {
        if (e.button !== 0) return; // apenas clique com botão esquerdo
        if (e.target.closest('#btn-pip-close') || e.target.closest('#btn-pip-pin')) return;

        if (isTauri && window.__TAURI__?.core?.invoke) {
          try {
            await window.__TAURI__.core.invoke('drag_pip_window');
            return;
          } catch (_) {}
        }
        if (isTauri && window.__TAURI__?.window?.getCurrentWindow) {
          try {
            await window.__TAURI__.window.getCurrentWindow().startDragging();
          } catch (_) {}
        }
      };

      const btnDrag = document.getElementById('btn-pip-drag');
      if (btnDrag) {
        btnDrag.addEventListener('mousedown', triggerDrag);
      }

      const pipHeader = document.querySelector('.pip-header');
      if (pipHeader) {
        pipHeader.addEventListener('mousedown', triggerDrag);
      }
    </script>
  </body>
</html>
